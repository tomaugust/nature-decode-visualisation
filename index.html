<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Data cube | UKCEH</title>
  <meta name="description" content="Decoding nature reveals its stories. An interactive data cube animation from UKCEH.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app is-intro">
    <!-- Read out by screen readers in this order for each step: the title, the tags and labels, then the caption -->
    <div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="false"></div>
    <header class="caption">
      <div class="caption-body">
        <h2 id="caption-title"></h2>
        <p id="insight-indicator" class="insight-indicator" aria-hidden="true" hidden></p>
        <p id="caption-text"></p>
        <p id="caption-summary" class="visually-hidden"></p>
      </div>
    </header>
    <main class="stage">
      <div id="canvas-wrap" class="canvas-wrap" role="img" aria-label=""></div>
      <div id="hero" class="hero" aria-hidden="true">
        <h1 id="hero-text"></h1>
        <img class="hero-logo" src="assets/UKCEH_Logo_Tagline_Stacked_White_Data.png" alt="">
      </div>
      <div id="callouts" class="callouts" aria-hidden="true"></div>
      <img id="logo" class="logo" src="assets/NCUK_Logo_White.png" alt="UKCEH. National Capability for UK Challenges." hidden>
      <div id="feedback" class="feedback" hidden>
        <p class="feedback-text"><a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=NlECf_M5LE-jxsuxziGzamOWU2fZKH5Nl_tGt_wCFO9UNFkyVUY3OUZGTElZQjlCWkRRNVgzTVdYOS4u&amp;origin=Invitation&amp;channel=0" target="_blank" rel="noopener">Tell us what you think of this animation</a></p>
        <img class="feedback-qr" src="assets/feedback-qr.svg" width="164" height="164" alt="QR code for the feedback form. Scan it with your phone's camera.">
      </div>
      <ul id="fallback" class="fallback" hidden></ul>
      <div id="virtual-cursor" class="virtual-cursor" aria-hidden="true" hidden></div>
      <button id="kiosk-start" class="kiosk-start" type="button">Play automatically</button>
      <button id="sound" class="sound" type="button" aria-pressed="true" hidden>Sound on</button>
      <p id="status" class="status" role="alert" hidden></p>
    </main>

    <footer class="controls">
      <p id="credit" class="note credit" hidden><a href="https://www.ceh.ac.uk/staff/tom-august" target="_blank" rel="noopener">Design and implementation by Tom August</a></p>
      <p id="note" class="note is-hidden"></p>
      <p id="kiosk-status" class="kiosk-status" hidden>Playing automatically. Click, touch or press a key to take control.</p>
      <div class="caption-controls">
        <ol id="progress" class="progress" aria-hidden="true"></ol>
        <p id="progress-label" class="visually-hidden"></p>
        <div class="buttons">
          <button id="back" type="button" aria-disabled="true">Back</button>
          <button id="next" type="button" class="primary">Next</button>
        </div>
      </div>
    </footer>
  </div>

  <div id="turn-prompt" class="turn-prompt" role="alert" hidden>
    <div class="turn-icon" aria-hidden="true"></div>
    <p>Please turn your phone on its side.</p>
  </div>

  <noscript><p class="noscript">This animation needs JavaScript.</p></noscript>
  <script src="data/load-data.js"></script>
  <script src="dist/app.js"></script>
</body>
</html>
